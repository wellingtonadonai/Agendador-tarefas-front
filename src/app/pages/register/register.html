<div class="Register-component">
  <mat-card>
    <mat-card-header class="padding-m">
      <mat-card-title>Cadastro de Usuário</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field class="full-width">
        <mat-label>Nome Completo</mat-label>
        <input placeholder="Digite seu nome completo" matInput />
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input placeholder="Digite seu Email" matInput />
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Senha</mat-label>
        <input type="password" placeholder="Cadastre sua senha" matInput />
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions >
      <button mat-raised-button class="full-width">CADASTRAR</button>
    </mat-card-actions>
  </mat-card>
</div>
